name: Perl checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-versions:
    name: Direct dependency versions / ${{ matrix.profile }}
    if: github.repository == 'libtmux/libtmux-perl'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        profile: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        id: perl
        with:
          perl-version: '5.44.0'
          enable-modules-cache: false
      - name: Cache dependency downloads and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.perl-cpm
          key: perl-dependencies-${{ runner.os }}-${{ steps.perl.outputs.perl-hash }}-${{ matrix.profile }}-${{ hashFiles('cpanfile', 'packages/*/cpanfile', 'scripts/dependency-profile.pl') }}
      - name: Provision the selected dependencies outside test loops
        run: |
          mkdir -p .cache
          curl --fail --silent --show-error --location --output .cache/cpm https://github.com/skaji/cpm/releases/download/v1.1.6/cpm
          printf '%s  %s\n' 2f85dea9272722d518297a3baa13a85ac7a9bbb18c0b529bd29eb7ccbf23c734 .cache/cpm | sha256sum --check
          perl .cache/cpm install --workers 2 --local-lib-contained .cache/dependency-bootstrap Module::CPANfile@1.1004
          perl -I.cache/dependency-bootstrap/lib/perl5 scripts/dependency-profile.pl generate .cache/dependency-profile '${{ matrix.profile }}'
          test ! -e local
          perl .cache/cpm install --workers 2 --local-lib-contained local --reinstall --cpanfile .cache/dependency-profile/cpanfile --snapshot /dev/null --show-build-log-on-failure
      - name: Verify loaded versions and run the native unit suites
        env:
          PERL5LIB: local/lib/perl5
        run: |
          python3 scripts/evidence.py dependency-versions -- perl scripts/dependency-profile.pl check .cache/dependency-profile local
          python3 scripts/evidence.py dependency-unit -- make check-metadata unit check-pod
      - name: Retain resolution and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-versions-${{ matrix.profile }}
          path: |
            .cache/dependency-profile/
            .cache/evidence/dependency-*
          retention-days: 7

  scaffold:
    name: Metadata, units, POD and generated checks
    if: github.repository == 'libtmux/libtmux-perl'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the development Perl pin
        id: perl
        run: |
          version=$(awk '$1 == "perl" { print $2 }' .tool-versions)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Perl and author dependencies
        uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: ${{ steps.perl.outputs.version }}
          install-modules-with: cpm
          install-modules-args: >-
            --top-level-phase configure,runtime,test,develop
      - name: Prepare the pinned independent filter evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tmux-python/libtmux
          ref: 699f72a507ef63d97792acc51e9eaa61649c538a
          path: .cache/reference-python
          persist-credentials: false
      - name: Check all distributions, documentation, and units
        run: make check
      - name: Export native declarations from the exact source revision
        run: perl scripts/export-api.pl --revision "$GITHUB_SHA" --exporter-revision "$GITHUB_SHA" --output .cache/native-api.json
      - name: Check the instruction link and whitespace
        run: |
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = AGENTS.md
          git diff --check
          git diff --exit-code

  linux-tmux:
    name: Linux Perl 5.44.0 / tmux ${{ matrix.tmux }}
    if: github.repository == 'libtmux/libtmux-perl'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        tmux: ['3.3', '3.3a', '3.4', '3.5', '3.5a', '3.6', '3.6a', '3.6b', '3.7', '3.7a', '3.7b', '3.7c', '3.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: '5.44.0'
          install-modules-with: cpm
          install-modules-args: --top-level-phase configure,runtime,test,develop
      - name: Provision pinned tmux outside the test loop
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential bison libevent-dev libncurses-dev pkg-config
          python3 scripts/compatibility.py --provision --version '${{ matrix.tmux }}'
      - name: Qualify owned real tmux, workspace and example workflows
        run: python3 scripts/compatibility.py --check --version '${{ matrix.tmux }}'
      - name: Retain per-cell qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-tmux-${{ matrix.tmux }}
          path: |
            .cache/compatibility/
            .cache/tmux-builds/*/provision.log
            .cache/tmux-builds/*/libtmux-build.json
          retention-days: 7
      - name: Verify no source changes
        if: always()
        run: git diff --check

  native-artifacts:
    name: Installed native archives
    if: github.repository == 'libtmux/libtmux-perl'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: '5.44.0'
          install-modules-with: cpm
          install-modules-args: --top-level-phase configure,runtime,test,develop
      - name: Provision a verified installer and external consumer runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential bison libevent-dev libncurses-dev pkg-config
          mkdir -p .cache
          curl --fail --silent --show-error --location --output .cache/cpm https://github.com/skaji/cpm/releases/download/v1.1.6/cpm
          printf '%s  %s\n' 2f85dea9272722d518297a3baa13a85ac7a9bbb18c0b529bd29eb7ccbf23c734 .cache/cpm | sha256sum --check
          python3 scripts/provision-consumer.py
          python3 scripts/compatibility.py --provision --version 3.8
      - name: Build and install exact archives, then execute installed consumers
        run: |
          make artifacts
          prefix=$(cat .cache/consumer-prefix)
          perl scripts/run-examples.pl --installed "$prefix"
          python3 scripts/compatibility.py --check --version 3.8 --installed "$prefix"
      - name: Verify no source changes
        if: always()
        run: git diff --check
      - name: Retain exact verified native archives and consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perl-native-archives
          path: |
            .cache/artifacts/
            .cache/compatibility/
          retention-days: 7
