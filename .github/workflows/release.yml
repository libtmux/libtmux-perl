name: CPAN release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      candidate-tag:
        description: Proposed decimal-version tag to verify without publishing
        required: true
        default: v0.003

permissions:
  contents: read

concurrency:
  group: cpan-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'libtmux/libtmux-perl'
    uses: ./.github/workflows/scaffold.yml

  inspect:
    name: Inspect tested release archives
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: '5.44.0'
          install-modules: >-
            LWP::UserAgent@6.83
            LWP::Protocol::https@6.17
            HTTP::Request::Common@7.04
            Test2::V1@1.302226
          install-modules-with: cpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.archive-id }}
          path: .cache/release
          merge-multiple: true
          digest-mismatch: error
      - name: Validate tag, source, package metadata and exact archive bytes
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.candidate-tag }}
          RELEASE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="v$(perl -Ipackages/core/lib -MLibTmux -e 'print $LibTmux::VERSION')"
          fi
          args=()
          if [[ "$RELEASE_EVENT" == push ]]; then
            args+=(--check-tag)
          fi
          perl scripts/release.pl --tag "$RELEASE_TAG" --source "$source_commit" \
            --artifacts .cache/release/artifacts "${args[@]}" > .cache/release/plan.json
          cat .cache/release/plan.json >> "$GITHUB_STEP_SUMMARY"
      - name: Verify token uploads without credentials or network dispatch
        run: prove -Iscripts/lib scripts/release/t/upload.t
      - name: Retain the inspected upload plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpan-release-plan
          path: .cache/release/plan.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Upload to PAUSE
    needs: [verify, inspect]
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'libtmux/libtmux-perl'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cpan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: '5.44.0'
          install-modules: >-
            LWP::UserAgent@6.83
            LWP::Protocol::https@6.17
            HTTP::Request::Common@7.04
          install-modules-with: cpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.archive-id }}
          path: .cache/release
          merge-multiple: true
          digest-mismatch: error
      - name: Upload the exact verified core, workspace and async archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PAUSE_TOKEN: ${{ secrets.PAUSE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          perl scripts/release.pl --tag "$RELEASE_TAG" --source "$source_commit" \
            --artifacts .cache/release/artifacts --publish
